apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: id
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: test
        path: /spec/template/spec/containers/2/name
        value: mutations
      - op: replace
        path: /spec/template/spec/containers/2/image
        value: docker.io/updspace/id-observability@sha256:c82b7474009486c3cdd8ac16786d06bb1c91ab46254c6182679c29e0309086a5
  - target:
      group: batch
      version: v1
      kind: CronJob
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false
