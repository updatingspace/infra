apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-to-id
  namespace: edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: caddy
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: updspace-id
      podSelector:
        matchLabels:
          app.kubernetes.io/name: id
          app.kubernetes.io/part-of: updspace-id
    ports:
    - protocol: TCP
      port: 8089
