apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: id
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: test
        path: /spec/template/spec/containers/2/name
        value: mutations
      - op: replace
        path: /spec/template/spec/containers/2/image
        value: docker.io/updspace/id-consent-api@sha256:b827552cf4e5bce8a7d994e76f4603538561c61d97d0479f68b232345f6b0626
      - op: test
        path: /spec/template/spec/containers/3/name
        value: web
      - op: replace
        path: /spec/template/spec/containers/3/image
        value: docker.io/updspace/id-consent-web@sha256:d045657b66b8c6975429e2844716ee068a2b6541fc2082c70dc123d56b385fd1
  - target:
      group: batch
      version: v1
      kind: CronJob
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false
