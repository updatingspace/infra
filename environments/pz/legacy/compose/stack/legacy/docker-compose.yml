name: pz-b42

services:
  zomboid:
    image: local/zomboid-control-panel-allinone:${PANEL_REF:-v1.1.18}

    build:
      context: .
      dockerfile: Dockerfile
      args:
        PANEL_REF: ${PANEL_REF:-latest}

    restart: unless-stopped
    init: true
    stop_grace_period: 2m

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Панель находится за TLS-terminating reverse proxy.
      HTTPS: "true"
      TRUST_PROXY: "1"
      CORS_ORIGINS: https://${PANEL_DOMAIN}

      # Project Zomboid integration.
      PZ_SERVER_PATH: /pz-server
      PZ_SAVE_PATH: /zomboid
      PZ_SERVER_BAT: start-server.sh
      PZ_SERVER_NAME: ${PZ_SERVER_NAME:-survival42}
      PZ_ADMIN_PASSWORD: ${PZ_ADMIN_PASSWORD}

      # SteamCMD/build management.
      PZ_BRANCH: ${PZ_BRANCH:-public}
      PZ_UPDATE_ON_START: ${PZ_UPDATE_ON_START:-false}
      PZ_VALIDATE_ON_UPDATE: ${PZ_VALIDATE_ON_UPDATE:-false}

      # После первого создания server.ini сервер может запускаться автоматически.
      PZ_AUTOSTART: ${PZ_AUTOSTART:-true}

      # JVM tuning.
      PZ_XMS: ${PZ_XMS:-4g}
      PZ_XMX: ${PZ_XMX:-8g}

      # RCON остаётся внутри одного контейнера.
      RCON_HOST: 127.0.0.1
      RCON_PORT: "27015"
      RCON_PASSWORD: ${RCON_PASSWORD}

      # Steam API key необязателен, но улучшает metadata модов.
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      MOD_CHECK_INTERVAL: ${MOD_CHECK_INTERVAL:-300000}

      TZ: ${TZ:-Europe/Helsinki}

    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "127.0.0.1:9090:9090/tcp"
    expose:
      - "3001"

    volumes:
      # Бинарные файлы игры и загруженный Workshop content.
      - ./data/pz-server:/pz-server

      # Saves, Server/*.ini, SandboxVars, db, Lua, logs, local mods.
      - ./data/zomboid:/zomboid

      # База и состояние панели.
      - ./data/panel:/app/data
      - ./data/panel-logs:/app/logs

      # Steam cache/config для уменьшения повторных загрузок.
      - ./data/steam:/home/steam/Steam

    networks:
      - edge

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      start_period: 15m
      retries: 5

    mem_limit: ${CONTAINER_MEMORY_LIMIT:-12g}
    mem_reservation: ${CONTAINER_MEMORY_RESERVATION:-8g}
    cpus: ${CONTAINER_CPUS:-3.5}
    pids_limit: 2048

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      # Нужны только стартовому entrypoint для подготовки bind mounts
      # и перехода на пользователя steam.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config

    networks:
      - edge

    depends_on:
      zomboid:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "caddy",
          "validate",
          "--config",
          "/etc/caddy/Caddyfile",
          "--adapter",
          "caddyfile"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.50
    pids_limit: 256

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    user: "0:0"
    env_file:
      - ./monitoring/monium.env
    environment:
      GOMEMLIMIT: 160MiB
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8888:8888"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
