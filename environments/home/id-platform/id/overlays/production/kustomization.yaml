apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: id
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: batch
      version: v1
      kind: CronJob
      namespace: updspace-id
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false
