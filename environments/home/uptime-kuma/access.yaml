# Apply after the administrator account has been created.
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: uptime-kuma
  ports:
    - {name: http, port: 3001, targetPort: http, nodePort: 30031}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuma-lan
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - {protocol: TCP, port: 3001}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kuma-from-shared-edge
  namespace: uptime-kuma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: caddy
      ports:
        - {protocol: TCP, port: 3001}
