apiVersion: v1
kind: Namespace
metadata:
  name: updspace-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: updspace-postgres
spec:
  capacity:
    storage: 30Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /srv/updspace/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [updspace-home]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: updspace-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: updspace-postgres
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: updspace-data
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: updspace-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: updspace-portal
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: updspace-portal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: updspace-id
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: updspace-id
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: updspace-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
          args: ["-c", "shared_buffers=256MB", "-c", "max_connections=120"]
          env:
            - name: POSTGRES_DB
              value: updspace
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums --auth-host=scram-sha-256
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, updspace]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, updspace]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: password
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: password
          secret:
            secretName: postgres-admin
            defaultMode: 0440
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
