provider = "oidc"
provider_display_name = "UpdSpace ID"
client_id = "observability"
# Use standard OIDC consent instead of the legacy approval_prompt default.
prompt = "consent"
http_address = "0.0.0.0:4180"
upstreams = []
reverse_proxy = true
# Caddy overwrites forwarding headers; NetworkPolicy admits only Caddy.
redirect_url = "/oauth2/callback"
whitelist_domains = ["grafana.updspace.com", "prometheus.updspace.com", "alerts.updspace.com", "errors.updspace.com", "status.updspace.com"]
oidc_issuer_url = "https://id.updspace.com"
skip_oidc_discovery = true
login_url = "https://id.updspace.com/oauth/authorize"
redeem_url = "http://id.updspace-id.svc.cluster.local:8089/oauth/token"
profile_url = "http://id.updspace-id.svc.cluster.local:8089/oauth/userinfo"
oidc_jwks_url = "http://id.updspace-id.svc.cluster.local:8089/.well-known/jwks.json"
code_challenge_method = "S256"
scope = "openid email profile offline_access"
insecure_oidc_skip_nonce = false
email_domains = ["*"]
skip_provider_button = true
cookie_name = "__Host-observability"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "5m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
set_xauthrequest = true
pass_access_token = true
pass_authorization_header = false
pass_basic_auth = false
skip_jwt_bearer_tokens = false
# Never log OAuth codes, state, cookies, or tokens from callback URLs.
request_logging = false
auth_logging = false
silence_ping_logging = true
pass_host_header = false
proxy_websockets = false
