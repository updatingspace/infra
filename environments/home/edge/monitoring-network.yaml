apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-to-monitoring
  namespace: edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: caddy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [grafana, prometheus, alertmanager]
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-from-caddy
  namespace: observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [grafana, prometheus, alertmanager]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: caddy
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9093}
