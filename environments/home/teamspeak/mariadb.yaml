apiVersion: v1
kind: Namespace
metadata:
  name: teamspeak
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: teamspeak
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    requests.storage: 2Gi
    persistentvolumeclaims: '1'
    pods: '1'
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: teamspeak-db-local
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  local:
    path: /srv/teamspeak/mariadb
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - updspace-home
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb
  namespace: teamspeak
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ''
  volumeName: teamspeak-db-local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: teamspeak
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: teamspeak
spec:
  selector:
    app.kubernetes.io/name: teamspeak-db
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: teamspeak
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: teamspeak-db
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: updspace-home
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mariadb
        image: docker.io/library/mariadb@sha256:a9547599cd87d7242435aea6fda22a9d83e2c06d16c658ef70d2868b3d3f6a80
        imagePullPolicy: IfNotPresent
        args:
        - --bind-address=0.0.0.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        env:
        - name: MYSQL_DATABASE
          value: teamspeak
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-existing
              key: root-password
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: run
          mountPath: /run/mysqld
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mariadb
      - name: run
        emptyDir:
          sizeLimit: 16Mi
