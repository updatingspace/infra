name: Infrastructure checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install real archive and restore test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age zstd rsync acl openjdk-17-jdk-headless
          python -m pip install -r requirements.txt -r environments/pz/kubernetes/backup/requirements.txt
      - name: Install pinned Caddy for authorization integration test
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz -o /tmp/caddy.tar.gz
          echo '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  /tmp/caddy.tar.gz' | sha512sum --check
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          echo 'CADDY_BINARY=/tmp/caddy' >> "$GITHUB_ENV"
      - name: Unit and real archive roundtrip tests
        env:
          GRAFANA_IMAGE: docker.io/grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
        run: python scripts/validate.py
      - name: Render access configuration
        run: python scripts/render.py > /tmp/updspace-access.json
      - name: Check generated monitoring manifests
        run: |
          python environments/home/monitoring/build.py
          git diff --exit-code -- environments/home/monitoring
      - name: Check whitespace
        run: git diff --check

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [platform, workloads, observability, backup-cloud]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - name: Validate and test with mock providers
        working-directory: environments/pz/kubernetes/${{ matrix.component }}
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform fmt -check
          terraform validate
          terraform test
