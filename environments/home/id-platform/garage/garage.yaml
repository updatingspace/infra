apiVersion: v1
kind: PersistentVolume
metadata:
  name: updspace-garage
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /srv/updspace/garage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [updspace-home]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage
  namespace: updspace-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: updspace-garage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: updspace-data
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    metadata_snapshots_dir = "/var/lib/garage/snapshots"
    db_engine = "lmdb"
    lmdb_map_size = "512MiB"
    metadata_fsync = true
    data_fsync = true
    metadata_auto_snapshot_interval = "6h"
    replication_factor = 1
    block_ram_buffer_max = "32MiB"
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    advertise_endpoint = "https://storage.updspace.com"
    advertise_path_style = true

    [admin]
    api_bind_addr = "127.0.0.1:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: updspace-data
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: updspace-data
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: updspace-data
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: updspace-home
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.4.1@sha256:0d7c74fc8ca6fef68a5a941c0e7558c8b1e92ba3588fa7505400e1350456c796
          command: [/garage]
          args: [server, --single-node]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-runtime
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-runtime
                  key: admin-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: s3
              containerPort: 3900
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: garage
        - name: config
          configMap:
            name: garage-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage-isolation
  namespace: updspace-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: caddy
      ports:
        - protocol: TCP
          port: 3900
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-to-garage
  namespace: edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: caddy
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: updspace-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
      ports:
        - protocol: TCP
          port: 3900
